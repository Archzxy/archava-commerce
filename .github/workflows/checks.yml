name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: archava/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            archava/backend/requirements.txt
            archava/backend/constraints.txt
      - name: Install dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci --prefix archava
          python -m pip install -r archava/backend/requirements.txt
      - name: Node tests and environment export guards
        run: npm test
      - name: Python unit tests
        run: python -m unittest discover -s archava/backend -p 'test_*.py' -v
      - name: Offline SDK integration tests
        run: python -m unittest discover -s archava/backend -p 'integration_*.py' -v
      - name: Build storefront catalog and widget
        run: npm run build
      - name: Check dependency advisories
        run: npm audit --prefix archava --audit-level=moderate
      - name: Export the standalone source module
        run: npm run export --prefix archava
